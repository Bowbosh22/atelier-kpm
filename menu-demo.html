<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu — Karibu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Passion One';src:url("passion-one.woff2") format("woff2");font-weight:400;font-display:swap}
:root{--gold:#e0ab4a;--terra:#c4622d;--text:#fbf3e6;--green:#25d366}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#120d09}
body{font-family:'Montserrat',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
button,a{font:inherit;color:inherit;text-decoration:none;border:0;background:none;cursor:pointer}
[hidden]{display:none!important}

.screen{
  position:relative;min-height:100vh;min-height:100dvh;width:100%;max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;overflow:hidden;overflow:clip;isolation:isolate;
  padding:env(safe-area-inset-top) 0 0;
}
.bg{position:absolute;inset:0;z-index:-2;background:#2a1b10 url("fond-karibu.webp") center/cover no-repeat;transition:filter .4s}
.veil{
  position:absolute;inset:0;z-index:-1;
  background:linear-gradient(to bottom,rgba(12,8,5,.78) 0%,rgba(12,8,5,.30) 28%,rgba(12,8,5,.15) 45%,rgba(12,8,5,.55) 72%,rgba(12,8,5,.92) 100%);
  transition:background .4s;
}
.screen.deep .bg{filter:blur(10px) brightness(.75);transform:scale(1.08)}
.screen.deep .veil{background:linear-gradient(to bottom,rgba(12,8,5,.82),rgba(12,8,5,.7) 50%,rgba(12,8,5,.92))}

.view{flex:1;display:flex;flex-direction:column;animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Accueil ---------- */
.logo{margin:clamp(26px,6vh,60px) auto 0;text-align:center;padding:0 24px}
.logo img{
  width:clamp(120px,34vw,160px);height:auto;border-radius:50%;display:block;margin:0 auto;
  box-shadow:0 0 0 3px rgba(224,171,74,.9),0 14px 40px rgba(0,0,0,.55);
}
.wordmark{
  margin-top:16px;font-family:'Passion One','Arial Black',Impact,sans-serif;font-weight:400;
  font-size:clamp(2.6rem,12.5vw,3.4rem);line-height:.95;letter-spacing:.05em;color:var(--text);
  text-shadow:0 3px 18px rgba(0,0,0,.55);
}
.tagline{margin-top:8px;font-size:.66rem;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:rgba(251,243,230,.9);text-shadow:0 2px 10px rgba(0,0,0,.6)}
.rule{width:44px;height:2px;background:var(--gold);margin:12px auto 0;border-radius:2px}
.spacer{flex:1;min-height:14px}

.hello{text-align:center;font-size:.72rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(251,243,230,.85);margin-bottom:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.tile{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  min-height:112px;padding:12px 8px;border-radius:16px;text-align:center;
  background:rgba(255,255,255,.11);
  backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid rgba(255,255,255,.22);box-shadow:0 10px 30px rgba(0,0,0,.35);
  transition:transform .18s,background .18s,border-color .18s;
}
.tile:active,.tile:hover{transform:translateY(-3px);background:rgba(255,255,255,.18);border-color:rgba(224,171,74,.8)}
.tile svg{width:38px;height:38px;stroke:var(--text);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:.8rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.tile small{font-size:.6rem;font-weight:600;letter-spacing:.04em;color:rgba(251,243,230,.72)}

.info{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:14px 16px 0;font-size:.66rem;font-weight:600;letter-spacing:.06em;color:rgba(251,243,230,.78)}
.info span::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin-right:7px;vertical-align:middle}

/* ---------- Barre du bas ---------- */
.bar{
  margin-top:16px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  background:rgba(12,8,5,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid rgba(255,255,255,.12);position:sticky;bottom:0;
}
.bar .it{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.6rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(251,243,230,.82)}
.bar .it svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bar .menu{
  width:62px;height:62px;margin-top:-34px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--terra);color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.5),0 0 0 5px rgba(12,8,5,.72);
  font-size:.55rem;font-weight:800;letter-spacing:.14em;
}
.bar .menu svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bar .wa{color:var(--green)}

/* ---------- En-tête des écrans intérieurs ---------- */
.topbar{display:flex;align-items:center;gap:14px;padding:18px 16px 6px}
.back{
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.back svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.crumb{font-size:.62rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.ttl{font-family:'Passion One','Arial Black',Impact,sans-serif;font-size:2.4rem;line-height:1;letter-spacing:.05em;text-transform:uppercase}

/* ---------- Écran catégories ---------- */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px 16px 24px}
.cat{
  position:relative;aspect-ratio:1/1.05;border-radius:18px;overflow:hidden;text-align:left;isolation:isolate;
  border:1px solid rgba(255,255,255,.2);box-shadow:0 10px 26px rgba(0,0,0,.4);
  display:flex;flex-direction:column;justify-content:flex-end;padding:16px;
  transition:transform .18s;
}
.cat:last-child:nth-child(odd){grid-column:1 / -1;aspect-ratio:2.2/1}
.cat::before{content:"";position:absolute;inset:0;z-index:-2;background:var(--img,url("fond-karibu.webp")) var(--pos,center)/var(--size,260%) no-repeat}
.cat::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(10,7,4,.9),rgba(10,7,4,.2) 65%,rgba(10,7,4,.35))}
.cat:active,.cat:hover{transform:translateY(-3px);border-color:rgba(224,171,74,.85)}
.cat small{font-size:.6rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.cat b{margin-top:4px;font-size:1.05rem;font-weight:800;text-transform:uppercase;line-height:1.1}
.cat i{position:absolute;top:12px;right:12px;font-style:normal;font-size:.62rem;font-weight:800;padding:4px 9px;border-radius:999px;background:rgba(12,8,5,.7);color:var(--text)}

/* ---------- Écran plats ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.25);font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(251,243,230,.8);background:rgba(255,255,255,.07)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#241707}

.banner{margin:14px 16px 0;height:170px;border-radius:18px;border:1px solid rgba(255,255,255,.2);box-shadow:0 10px 26px rgba(0,0,0,.4);background:var(--img) center/cover no-repeat;position:relative;overflow:hidden}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,7,4,.45),transparent 60%)}
.tbl{display:inline-block;margin-bottom:6px;padding:5px 14px;border-radius:999px;background:var(--gold);color:#241707;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.7rem}
.dishes{list-style:none;padding:6px 20px 28px}
.dualhead{display:grid;grid-template-columns:1fr 84px 70px;gap:8px;padding:14px 20px 0;font-size:.6rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);text-align:right}
.dualhead span:first-child{text-align:left}
.dish{display:flex;align-items:baseline;gap:12px;padding:17px 0;border-bottom:1px solid rgba(255,255,255,.16);animation:in .4s both}
.dish .n{flex:1;min-width:0}
.dish .n b{display:block;font-size:1rem;font-weight:700}
.dish .n span{display:block;margin-top:2px;font-size:.8rem;color:rgba(251,243,230,.65)}
.dish .p{white-space:nowrap;font-weight:800;color:var(--gold)}
.dish .p small{font-size:.66rem;font-weight:700;color:rgba(251,243,230,.65);margin-left:3px}
.dish.dual{display:grid;grid-template-columns:1fr 84px 70px;gap:8px;align-items:baseline}
.dish.dual .p{text-align:right}
.dish.dual .p.none{color:rgba(251,243,230,.35);font-weight:600}

@media (min-width:521px){body{display:grid;place-items:center}.screen{min-height:min(100vh,900px);border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.6)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="screen" id="screen">
  <div class="bg" role="img" aria-label="Riz jollof et plantains frits"></div>
  <div class="veil"></div>

  <!-- ACCUEIL -->
  <section class="view" id="v-home">
    <header class="logo">
      <img src="logo-karibu.webp" width="360" height="360" alt="Karibu — Restaurant · Lounge Bar">
      <h1 class="wordmark">KARIBU</h1>
      <p class="tagline">Restaurant</p>
      <div class="rule"></div>
    </header>
    <div class="spacer"></div>
    <p class="hello">Que souhaitez-vous découvrir ?</p>
    <nav class="tiles" aria-label="Menu" id="tiles"></nav>
    <div class="info" id="info"></div>
  </section>

  <!-- CATÉGORIES -->
  <section class="view" id="v-cats" hidden>
    <div class="topbar">
      <a class="back" href="#" aria-label="Retour"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
      <div><div class="crumb">Karibu</div><div class="ttl" id="cats-title"></div></div>
    </div>
    <div class="cats" id="cats"></div>
  </section>

  <!-- LISTE -->
  <section class="view" id="v-list" hidden>
    <div class="topbar">
      <a class="back" id="list-back" href="#" aria-label="Retour"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
      <div><div class="crumb" id="list-crumb"></div><div class="ttl" id="list-title"></div></div>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="chips" id="chips"></div>
    <div class="dualhead" id="dualhead" hidden><span></span><span>Bouteille</span><span>Verre</span></div>
    <ul class="dishes" id="dishes"></ul>
  </section>

  <footer class="bar">
    <a class="it" id="map" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      Itinéraire
    </a>
    <a class="menu" href="#" aria-label="Accueil du menu">
      <svg viewBox="0 0 24 24"><path d="M4 5h7a1 1 0 0 1 1 1v13a2 2 0 0 0-2-2H4z"/><path d="M20 5h-7a1 1 0 0 0-1 1v13a2 2 0 0 1 2-2h6z"/></svg>
      MENU
    </a>
    <a class="it wa" id="wa" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-13.3 7.9L3 21l1.2-4.6A9 9 0 1 1 21 12z"/><path d="M8.5 9c.3 2.2 2.3 4.6 5 5.5l1.5-1.2-1.7-1-.8.6c-.9-.5-1.5-1.2-1.9-2l.6-.8-1-1.7z"/></svg>
      WhatsApp
    </a>
  </footer>
</main>

<script>
/* =====================================================================
   DONNÉES — carte de Karibu (prix en FC)
   dish : n = nom · d = précision · p = prix · v = prix du verre (spiritueux)
   ===================================================================== */
const RESTO = {
  adresse: "92 Av. de l'Indépendance",
  horaires: "Ouvert 24h/24",
  whatsapp: "242068201220",
  carte: "https://www.google.com/maps/search/?api=1&query=Karibu+Self+92+Avenue+de+l%27Ind%C3%A9pendance+Brazzaville"
};

const ICONS = {
  plats:    '<path d="M8 44h48"/><path d="M12 44c0-11 9-19 20-19s20 8 20 19"/><path d="M32 25v-4"/><circle cx="32" cy="19" r="2.5"/><path d="M6 50h52"/>',
  boissons: '<path d="M12 12h40L32 34z"/><path d="M32 34v18"/><path d="M22 52h20"/><path d="M40 12l8-8"/><circle cx="24" cy="19" r="2"/>',
  glaces:   '<path d="M19 30a13 13 0 0 1 26 0z"/><path d="M20 30l12 27 12-27"/><path d="M26 30l6 14M38 30l-6 14"/>',
  soir:     '<path d="M10 34h44c0 12-9 19-22 19S10 46 10 34z"/><path d="M23 26c-2-3 2-5 0-9M33 26c-2-3 2-5 0-9M43 26c-2-3 2-5 0-9"/>'
};

const SECTIONS = {
  plats: { label:"Plats", sub:"Barbecue · Pizza · Pâtes", cats:[
    { id:"barbecue", img:"cat-barbecue.webp", label:"Barbecue", pos:"20% 60%", dishes:[
      { n:"Poulet mayo", p:"7 500" },
      { n:"Mouton à l'étouffé", p:"10 000" } ]},
    { id:"pates", img:"cat-pates.webp", label:"Pâtes", pos:"75% 40%", dishes:[
      { n:"Alfredo", p:"8 500" },
      { n:"Carbonara", p:"8 000" },
      { n:"Bolognaise", p:"6 000" } ]},
    { id:"fastfood", img:"cat-fastfood.webp", label:"Fast food", pos:"50% 85%", dishes:[
      { n:"Ju-King", p:"8 000" },
      { n:"Chawarma", p:"2 500" } ]},
    { id:"formules", img:"cat-formules.webp", label:"Formules", pos:"85% 90%", dishes:[
      { n:"Cheese burger", d:"+ frites + eau + jus", p:"5 000" },
      { n:"Wrap poulet avocat", d:"+ frites", p:"3 500" },
      { n:"Box 6 wings", d:"Épicé ou normal", p:"4 000" },
      { n:"Box 9 wings", d:"Épicé ou normal", p:"7 000" } ]},
    { id:"pizza", img:"cat-pizza.webp", label:"Pizza", pos:"35% 25%", dishes:[
      { n:"Margherita", p:"5 000" },
      { n:"Reine", p:"6 500" },
      { n:"4 fromages", p:"7 500" },
      { n:"Américaine", p:"7 000" },
      { n:"Barbecue poulet", p:"6 500" },
      { n:"Ticken", p:"7 000" } ]}
  ]},

  boissons: { label:"Boissons", sub:"Bières · Cocktails · Whisky", cats:[
    { id:"bieres", img:"cat-bieres.webp", label:"Bières", pos:"30% 20%", dishes:[
      { n:"Primus", p:"1 500" }, { n:"Ngock", p:"1 500" }, { n:"Heineken", p:"2 000" },
      { n:"Desperados", p:"2 500" }, { n:"33 Export", p:"1 500" }, { n:"Beaufort", p:"1 500" },
      { n:"Castel GM", p:"2 000" }, { n:"Castel PM", p:"1 500" }, { n:"Turbo King", p:"1 500" },
      { n:"Guinness", p:"2 000" }, { n:"Savana", p:"2 000" } ]},
    { id:"autres", img:"cat-autres.webp", label:"Autres boissons", pos:"70% 70%", dishes:[
      { n:"Class", p:"1 500" }, { n:"Booster tonic", p:"1 500" }, { n:"Gin tonic", p:"1 500" },
      { n:"Booster rouge", p:"1 500" }, { n:"Chill", p:"1 500" }, { n:"Stark", p:"1 500" },
      { n:"Racine", p:"1 500" }, { n:"Black", p:"1 500" }, { n:"Cérès", p:"5 000" },
      { n:"Coca-Cola", p:"1 000" }, { n:"Grenadine", p:"1 000" }, { n:"Fanta", p:"1 000" },
      { n:"Fanta passion", p:"1 000" }, { n:"Eau PM", p:"500" }, { n:"Red Bull", p:"2 000" },
      { n:"XXL", p:"2 000" } ]},
    { id:"spiritueux", img:"cat-spiritueux.webp", label:"Whisky & spiritueux", pos:"15% 80%", dual:true, dishes:[
      { n:"Martini blanc", p:"30 000", v:"3 500" },
      { n:"Martini rouge", p:"30 000", v:"3 500" },
      { n:"Baileys", p:"30 000", v:"3 500" },
      { n:"Red Label", p:"30 000", v:"3 500" },
      { n:"Black Label", p:"40 000", v:"5 000" },
      { n:"Chivas 12", p:"40 000", v:"5 000" },
      { n:"Jack Daniel's Honey", p:"45 000", v:"6 000" },
      { n:"Jack Daniel's", p:"40 000", v:"5 000" },
      { n:"Grant's", p:"30 000", v:"3 500" },
      { n:"Absolut vodka", p:"30 000", v:"3 500" },
      { n:"Tequila Camino", p:"30 000", v:"1 500" },
      { n:"Ballantine's", p:"25 000", v:"" } ]},
    { id:"cocktails", img:"cat-cocktails.webp", label:"Cocktails", pos:"60% 15%", dishes:[
      { n:"Sex on the beach", p:"7 000" },
      { n:"Mojito alcoolisé", p:"7 000" },
      { n:"Tequila sunrise", p:"7 000" },
      { n:"Cocktail signature", p:"7 000" } ]},
    { id:"mocktails", img:"cat-mocktails.webp", label:"Mocktails & jus", pos:"90% 55%", dishes:[
      { n:"Mojito sans alcool", p:"5 000" },
      { n:"KARIBU self", p:"5 000" },
      { n:"Piña colada", p:"5 000" },
      { n:"Bora Bora", p:"5 000" },
      { n:"Jus naturel", p:"2 000" },
      { n:"Jus frais", p:"2 500" } ]}
  ]},

  glaces: { label:"Glaces", sub:"À la boule", cats:[
    { id:"glaces", img:"cat-glaces.webp", label:"Glaces", dishes:[
      { n:"Banane", d:"La boule", p:"1 000" },
      { n:"Fraise", d:"La boule", p:"1 000" },
      { n:"Chocolat", d:"La boule", p:"1 000" },
      { n:"Vanille", d:"La boule", p:"1 000" } ]}
  ]},

  soir: { label:"Menu du soir", sub:"Bouillons", cats:[
    { id:"soir", img:"cat-soir.webp", label:"Menu du soir", dishes:[
      { n:"Bouillon sauvage", p:"5 000" },
      { n:"Bouillon de queue de bœuf", p:"6 000" },
      { n:"Bouillon de côte", p:"5 000" },
      { n:"Bouillon de viande", p:"6 000" } ]}
  ]}
};
/* ===================================================================== */

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$("#tiles").innerHTML = Object.entries(SECTIONS).map(([id, s]) => `
  <a class="tile" href="#${id}">
    <svg viewBox="0 0 64 64" aria-hidden="true">${ICONS[id]}</svg>
    <b>${esc(s.label)}</b><small>${esc(s.sub)}</small>
  </a>`).join("");
$("#info").innerHTML = `<span>${esc(RESTO.adresse)}</span><span>${esc(RESTO.horaires)}</span>`;
$("#map").href = RESTO.carte;
const TABLE = (new URLSearchParams(location.search).get("table") || "").replace(/\D/g,"").slice(0,3);
$("#wa").href = `https://wa.me/${RESTO.whatsapp}?text=` + encodeURIComponent(TABLE ? `Bonjour Karibu, table ${TABLE} : je souhaite passer une commande.` : "Bonjour Karibu, je souhaite passer une commande.");
if (TABLE) $("#info").insertAdjacentHTML("afterbegin", `<span class="tbl">Table ${TABLE}</span>`);

function show(id, deep){
  ["v-home","v-cats","v-list"].forEach(v => { $("#"+v).hidden = v !== id; });
  $("#screen").classList.toggle("deep", !!deep);
  window.scrollTo(0, 0);
}

function route(){
  const [sec, catId] = location.hash.replace("#","").split("/");
  const S = SECTIONS[sec];
  if (!S) return show("v-home", false);
  const single = S.cats.length === 1;

  if (!catId && !single){
    $("#cats-title").textContent = S.label;
    $("#cats").innerHTML = S.cats.map(c => `
      <a class="cat" href="#${sec}/${c.id}" style="--pos:${c.pos || "center"}${c.img ? `;--img:url('${c.img}');--size:cover` : ""}">
        <i>${c.dishes.length} ${c.dishes.length > 1 ? "choix" : "choix"}</i>
        <small>${esc(S.label)}</small><b>${esc(c.label)}</b>
      </a>`).join("");
    return show("v-cats", true);
  }

  const cat = S.cats.find(c => c.id === catId) || S.cats[0];
  $("#list-back").href = single ? "#" : "#" + sec;
  $("#list-crumb").textContent = single ? "Karibu" : `Karibu · ${S.label}`;
  $("#list-title").textContent = cat.label;
  const bn = $("#banner"); bn.hidden = !(single && cat.img);
  if (!bn.hidden) bn.style.setProperty("--img", `url('${cat.img}')`);
  $("#chips").hidden = single;
  $("#chips").innerHTML = single ? "" : S.cats.map(c =>
    `<a class="chip ${c.id === cat.id ? "on" : ""}" href="#${sec}/${c.id}">${esc(c.label)}</a>`).join("");
  const on = $(".chip.on"); if (on) $("#chips").scrollLeft = Math.max(0, on.offsetLeft - 16);
  $("#dualhead").hidden = !cat.dual;
  $("#dishes").innerHTML = cat.dishes.map((d, i) => cat.dual ? `
    <li class="dish dual" style="animation-delay:${i*40}ms">
      <div class="n"><b>${esc(d.n)}</b></div>
      <div class="p">${esc(d.p)}<small>FC</small></div>
      ${d.v ? `<div class="p">${esc(d.v)}<small>FC</small></div>` : `<div class="p none">—</div>`}
    </li>` : `
    <li class="dish" style="animation-delay:${i*40}ms">
      <div class="n"><b>${esc(d.n)}</b>${d.d ? `<span>${esc(d.d)}</span>` : ""}</div>
      <div class="p">${esc(d.p)}<small>FC</small></div>
    </li>`).join("");
  show("v-list", true);
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
